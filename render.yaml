services:
  - type: web
    name: qshield-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qshield-db
          property: connectionString

databases:
  - name: qshield-db
    databaseName: qshield
    user: qshield_user
    plan: free
