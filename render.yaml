services:
  - type: web
    name: qshield-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: qshield-redis
          property: connectionString

  - type: worker
    name: qshield-worker
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A app.workers.celery_app.celery worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qshield-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: qshield-redis
          property: connectionString

  - type: redis
    name: qshield-redis
    ipAllowList: []
    plan: free

databases:
  - name: qshield-db
    databaseName: qshield
    user: qshield_user
    plan: free
